<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Servicios | Turnify</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">

    <link rel="stylesheet" href="css/style.css">

    <script type="module" src="js/servicios.js"></script>
    <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"
    defer>
</script>

<script src="js/menu.js" defer></script>
</head>

<body class="d-flex flex-column min-vh-100">
    <header class="border-bottom">
        <nav class="container py-3 d-flex flex-wrap gap-3
                    justify-content-between align-items-center">
            <a class="marca text-decoration-none" href="dashboard.html">
                Turnify<span>.</span>
            </a>
            <a class="link-light" href="clientes.html">
    Clientes
</a>
            <div class="d-flex flex-wrap align-items-center gap-3">
                <a class="link-light" href="dashboard.html">
                    Dashboard
                </a>

                <span id="nombreUsuario" class="texto-secundario"></span>

                <button id="btnSalir" class="btn btn-outline-light">
                    Cerrar sesión
                </button>
            </div>
        </nav>
        <div id="menuPrincipal"></div>
    </header>

    <main class="container py-5 flex-grow-1">
        <p class="etiqueta">SOPORTE</p>

        <div class="d-flex flex-wrap gap-3 justify-content-between
                    align-items-center mb-4">
            <h1 class="mb-0">Servicios</h1>

            <button id="btnActualizar" class="btn btn-turnify">
                Actualizar listado
            </button>
        </div>

        <div
            id="mensaje"
            class="alert d-none"
            role="status"
            aria-live="polite">
        </div>
        <section class="panel-resumen p-4 mb-4">
    <h2 id="tituloFormulario" class="h4 mb-3">
        Nuevo servicio
    </h2>

    <form id="servicioForm">
        <div class="row g-3">
            <div class="col-md-6">
                <label for="nombre" class="form-label">Nombre</label>
                <input
                    id="nombre"
                    type="text"
                    class="form-control"
                    maxlength="100"
                    required>
            </div>

            <div class="col-md-3">
                <label for="precio" class="form-label">Precio</label>
                <input
                    id="precio"
                    type="number"
                    class="form-control"
                    min="0.01"
                    step="0.01"
                    required>
            </div>

            <div class="col-md-3">
                <label for="duracion" class="form-label">
                    Duración en minutos
                </label>
                <input
                    id="duracion"
                    type="number"
                    class="form-control"
                    min="1"
                    max="2147483647"
                    step="1"
                    required>
            </div>

            <div class="col-12 d-flex gap-2">
                <button
                    id="btnGuardar"
                    type="submit"
                    class="btn btn-turnify">
                    Crear servicio
                </button>

                <button
                    id="btnCancelar"
                    type="button"
                    class="btn btn-outline-light d-none">
                    Cancelar edición
                </button>
            </div>
        </div>
    </form>
</section>

        <div class="panel-resumen p-3">
            <div class="table-responsive">
                <table class="table table-dark table-hover align-middle mb-0">
                    <caption class="texto-secundario">
                        Servicios activos e inactivos de la barbería.
                    </caption>

                    <thead>
                        <tr>
                            <th scope="col">Servicio</th>
                            <th scope="col" class="text-end">Precio</th>
                            <th scope="col">Duración</th>
                            <th scope="col">Estado</th>
                            <th scope="col">Acciones</th>

                        </tr>
                    </thead>
                    

                    <tbody id="tablaServicios"></tbody>
                </table>
            </div>
        </div>
    </main>
</body>
</html>
