<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión | Turnify</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">

    <link rel="stylesheet" href="css/style.css">
    <script src="js/login.js" defer></script>
    <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"
    defer>
</script>

<script src="js/menu.js" defer></script>
</head>

<body class="d-flex flex-column min-vh-100">
    <header class="border-bottom">
        <nav class="container py-3">
            <a class="marca text-decoration-none" href="index.html">
                Turnify<span>.</span>
            </a>
        </nav>
    </header>

    <main class="container flex-grow-1 d-flex align-items-center py-5">
        <div class="row justify-content-center w-100 mx-0">
            <div class="col-12 col-md-8 col-lg-5">
                <section class="panel-resumen p-4 p-md-5">
                    <h1 class="h3 mb-2">Iniciar sesión</h1>

                    <p class="texto-secundario mb-4">
                        Ingresá para administrar tu barbería.
                    </p>

                    <div
                        id="mensaje"
                        class="alert d-none"
                        role="status"
                        aria-live="polite">
                    </div>

                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="nombreUsuario" class="form-label">
                                Usuario
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="nombreUsuario"
                                name="nombreUsuario"
                                autocomplete="username"
                                maxlength="50"
                                required>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label">
                                Contraseña
                            </label>

                            <input
                                type="password"
                                class="form-control"
                                id="password"
                                name="password"
                                autocomplete="current-password"
                                required>
                        </div>

                        <button
                            type="submit"
                            id="btnIngresar"
                            class="btn btn-turnify w-100">
                            Ingresar
                        </button>
                    </form>

                    <a href="index.html" class="link-light d-inline-block mt-4">
                        Volver al inicio
                    </a>
                </section>
            </div>
        </div>
    </main>
</body>
</html>
